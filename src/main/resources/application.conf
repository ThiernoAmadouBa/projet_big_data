# =====================================================================
#  application.conf - configuration externalisée (Partie 7)
#  Aucune valeur de ce fichier n'est codée en dur dans le code Scala.
#  Si une clé est absente, ConfigLoader applique une valeur par défaut.
#
#  Surcharge possible SANS modifier le fichier :
#    - propriété JVM :  -Dapp.data.output.path=/tmp/out
#    - variable d'env : APP_ENABLE_CACHE=false  APP_ENABLE_BROADCAST=false
#    - autre fichier :  -Dconfig.file=/chemin/vers/mon.conf
# =====================================================================
app {
  name = "EcommerceAnalytics"

  spark {
    master = "local[*]"          # ignoré si spark-submit fournit --master
    shuffle.partitions = 8       # spark.sql.shuffle.partitions (Q5.2)
    hadoop-home = ""             # Windows, facultatif : dossier contenant bin\winutils.exe
    windows-local-fs-fix = true  # Windows : evite winutils.exe / hadoop.dll (voir WindowsSafeLocalFileSystem)
  }

  optimization {                 # bascule "avant / après optimisation" (Q5.3)
    enable-cache = true
    enable-cache = ${?APP_ENABLE_CACHE}
    enable-broadcast = true
    enable-broadcast = ${?APP_ENABLE_BROADCAST}
  }

  data {
    input {                      # chemins relatifs à la racine du projet
      transactions = "src/main/resources/data/transactions.csv"
      users        = "src/main/resources/data/users.json"
      products     = "src/main/resources/data/products.parquet"
      merchants    = "src/main/resources/data/merchants.csv"
    }
    output {
      path = "output/"
    }
  }

  validation {
    transaction { min-amount = 0.0, timestamp-length = 14 }
    user        { min-age = 16, max-age = 100, min-income = 0.0 }
    product     { min-price = 0.0, min-rating = 1.0, max-rating = 5.0 }
    merchant    { min-commission = 0.0, max-commission = 1.0 }
  }

  analytics {
    behavior {
      window-days = 7            # fenêtre glissante (Q3.3)
      active-min-days = 5        # jours distincts requis pour is_active_user
    }
    suspicious {                 # bonus Q3.4
      amount-excess-pct = 300.0  # "dépasse de plus de 300 %" le panier moyen
      delay-minutes = 5.0        # délai < 5 minutes
      min-conditions = 2         # au moins 2 conditions sur 4
      top-n = 20                 # nombre de montants affichés en console
    }
    cohort { retention-month = 3 }  # Q4.2 : meilleure rétention à M+3
    products { top-n = 10 }         # Q4.4
  }
}
