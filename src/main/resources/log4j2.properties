# Journalisation de Spark : seulement les avertissements, sur la sortie standard
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_OUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{HH:mm:ss} %p %c{1}: %m%n

# Bruit connu et sans danger
logger.nativecodeloader.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecodeloader.level = error
logger.shell.name = org.apache.hadoop.util.Shell
logger.shell.level = error
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
